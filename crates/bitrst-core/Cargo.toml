[package]
name = "bitrst-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
bitrst-crypto = { path = "../bitrst-crypto" }
bitrst-script = { path = "../bitrst-script" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
thiserror = "1"

[features]
test-short-period = []

[dev-dependencies]
hex = "0.4"
secp256k1 = { version = "0.29", features = ["global-context"] }
serde_json = "1"
tempfile = "3.27.0"
