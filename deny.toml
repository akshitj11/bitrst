# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
unmaintained = "workspace"
unsound = "all"
yanked = "deny"

# ignore = [
#   { id = "RUSTSEC-20XX-XXXX", reason = "only affects feature we do not use" },
# ]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "CC0-1.0",
    "0BSD",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "allow"
highlight = "all"

# deny = [
#   { name = "some-crate", reason = "known supply chain compromise" },
# ]

# skip = [
#   { name = "some-crate", version = "=1.0.0", reason = "unavoidable transitive duplicate" },
# ]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
